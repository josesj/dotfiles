# Hardware de la flota que las plantillas necesitan: el codificador de
# Sunshine. Se lee mediante `index .hosts .chezmoi.hostname`. El sistema
# operativo sale de .chezmoi.os; los equipos Mac no tienen claves.
hosts:
  tycho:
    # GeForce RTX 5080 (Blackwell): NVENC.
    sunshine_encoder: nvenc
  deimos:
    # Radeon RX 6600 (Navi 23) sobre Mesa: VA-API (H.264 y HEVC, sin AV1).
    sunshine_encoder: vaapi
  phobos: {}
  janus: {}
