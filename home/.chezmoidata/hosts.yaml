# Hardware de la flota que las plantillas necesitan: las claves de Sunshine de
# Tycho, que se usa en remoto, y el decodificador de mpv y el codificador de OBS
# de Deimos. Se lee mediante `index .hosts .chezmoi.hostname`. El sistema
# operativo sale de .chezmoi.os; los equipos Mac no tienen claves.
hosts:
  tycho:
    sunshine:
      # GeForce RTX 5080 (Blackwell): NVENC con H.264, HEVC y AV1.
      encoder: nvenc
      # Sin output_name: headless, el dongle HDMI es el monitor 0 de KMS, el de
      # serie. Si se conecta otro monitor por DisplayPort, pasa a ser el 1.
    # Salida que Sunshine ajusta al modo del cliente (apps.json): el dongle HDMI
    # Evanlak8K V2 (4K a 60 Hz, 1440p a 144 Hz, 1080p a 144/120 Hz).
    sunshine_display: HDMI-A-1
  deimos:
    # Radeon RX 6600 (Navi 23) sobre Mesa/RADV: decodificación VA-API.
    mpv_hwdec: vaapi
    mpv_comment: "Deimos: Radeon RX 6600 (Navi 23), Mesa/RADV y Wayland."
    # OBS: VA-API (H.264 para emitir, HEVC para grabar; Navi 23 no codifica AV1).
    obs_encoder: vaapi
  phobos: {}
  janus: {}
