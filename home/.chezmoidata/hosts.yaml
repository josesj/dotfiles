# Hardware de la flota que las plantillas necesitan: las claves de Sunshine
# propias de cada GPU. Se lee mediante `index .hosts .chezmoi.hostname`. El
# sistema operativo sale de .chezmoi.os; los equipos Mac no tienen claves.
hosts:
  tycho:
    sunshine:
      # GeForce RTX 5080 (Blackwell): NVENC con H.264, HEVC y AV1.
      encoder: nvenc
  deimos:
    sunshine:
      # Radeon RX 6600 (Navi 23), única GPU (el UHD 770 del i5 está
      # desactivado), con Mesa/radeonsi: VA-API codifica H.264 y HEVC.
      encoder: vaapi
      adapter_name: /dev/dri/renderD128
      # Monitor 0 de KMS: el LG 27UP850 (4K a 60 Hz) por DP-3.
      output_name: 0
      # Navi 23 no codifica AV1: no se ofrece a Moonlight.
      av1_mode: 1
  phobos: {}
  janus: {}
