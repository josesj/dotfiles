# Shared by Chrome and Chromium: ~/.config/chromium-flags.conf links here.

# Chrome's interface follows the desktop's light/dark mode (through the desktop
# portal), while websites always receive prefers-color-scheme: light.
--blink-settings=preferredColorScheme=1

# Native Wayland rendering with input method integration, as in VS Code.
--ozone-platform=wayland
--enable-wayland-ime
--wayland-text-input-version=3

# Hardware video. Decoding through VA-API needs no flag since Chromium 143 when
# vainfo works (Mesa/radeonsi on Deimos). Encoding is still opt-in: it offloads
# the webcam stream of video calls and in-browser recordings to the GPU. On
# Tycho's NVIDIA card there is no VA-API encoder and Chrome keeps using the CPU.
# Chrome reads a single --enable-features line: add any other feature here.
--enable-features=AcceleratedVideoEncoder
