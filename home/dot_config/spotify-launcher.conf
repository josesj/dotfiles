# Spotify en Wayland nativo. Por defecto corre sobre XWayland y GNOME no casa
# su ventana con el lanzador, así que el dash muestra el icono genérico.
# --force-dark-mode: sin decoraciones del servidor, Chromium dibuja el marco de
# la ventana y no detecta el modo oscuro de GNOME, así que lo pintaba claro.
[spotify]
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland", "--force-dark-mode"]
