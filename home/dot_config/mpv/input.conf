# Seeking and volume.
RIGHT seek 5
LEFT seek -5
UP seek 60
DOWN seek -60
Shift+RIGHT seek 30 exact
Shift+LEFT seek -30 exact
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2

# Useful playback controls.
SPACE cycle pause
ENTER cycle fullscreen
m cycle mute
i script-binding stats/display-stats-toggle
I script-binding stats/display-stats
s screenshot video
S screenshot window
Ctrl+s screenshot each-frame

# Tracks, subtitles and synchronization.
a cycle audio
v cycle sub-visibility
j cycle sub
J cycle sub down
Ctrl+LEFT add sub-delay -0.1
Ctrl+RIGHT add sub-delay 0.1
Ctrl+UP add audio-delay 0.1
Ctrl+DOWN add audio-delay -0.1

