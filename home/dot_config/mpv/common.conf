# Shared playback behavior. GPU, decoder, scaling and display-specific options
# belong in hosts/<hostname>/mpv.conf.

# Open at the video's natural size, capped at 80% of the usable desktop. Plasma
# Wayland uses the centered-placement KWin rule from configure-plasma.sh;
# setting geometry here would incorrectly anchor the top-left corner.
autofit-larger=80%x80%

# PipeWire is the desktop-native audio path.
ao=pipewire
audio-file-auto=fuzzy
audio-pitch-correction=yes
audio-normalize-downmix=yes

# yt-dlp streaming. Prefer separate video and audio streams up to 4K; the
# stream-2k and stream-4k profiles below provide explicit launch-time choices.
ytdl=yes
ytdl-format=bestvideo[height<=2160]+bestaudio/best[height<=2160]
ytdl-raw-options=retries=10,fragment-retries=10
network-timeout=30

# Streaming cache: enough readahead for high-bitrate 4K without unbounded RAM.
cache=auto
cache-on-disk=no
cache-pause=yes
cache-pause-initial=no
cache-pause-wait=2
demuxer-readahead-secs=120
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB

# Language and subtitle preferences.
alang=es,spa,en,eng,it,ita
slang=es,spa,en,eng,it,ita
subs-with-matching-audio=yes
sub-auto=fuzzy
sub-file-paths=sub:subs:subtitles
sub-border-size=2
sub-shadow-offset=1

# Always start at the beginning and close normally at end of playback.
resume-playback=yes
save-position-on-quit=yes
keep-open=no
keep-open-pause=no

# Desktop-friendly behavior.
force-window=immediate
osc=yes
osd-bar=yes
osd-duration=1500
osd-on-seek=bar
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
screenshot-template=mpv-shot-%Y%m%d-%H%M%S-%n

# Select with `mpv --profile=stream-2k URL` or `mpv --profile=stream-4k URL`.
[stream-2k]
profile-desc=Network playback up to 1440p
ytdl-format=bestvideo[height<=1440]+bestaudio/best[height<=1440]

[stream-4k]
profile-desc=Network playback up to 2160p
ytdl-format=bestvideo[height<=2160]+bestaudio/best[height<=2160]
