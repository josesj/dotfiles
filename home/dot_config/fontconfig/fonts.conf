<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <!-- Use Medium for normal monospace text; explicit bold weights remain bold. -->
 <match target="pattern">
  <test compare="eq" name="family">
   <string>monospace</string>
  </test>
  <edit binding="weak" mode="append_last" name="weight">
   <const>medium</const>
  </edit>
 </match>
 <!-- Consistent generic families for desktop applications and browsers. -->
 <alias>
  <family>sans-serif</family>
  <prefer>
   <family>Noto Sans</family>
   <family>Noto Sans CJK JP</family>
   <family>Noto Color Emoji</family>
   <family>Noto Sans Symbols 2</family>
  </prefer>
 </alias>
 <alias>
  <family>serif</family>
  <prefer>
   <family>Noto Serif</family>
   <family>Noto Serif CJK JP</family>
   <family>Noto Color Emoji</family>
   <family>Noto Sans Symbols 2</family>
  </prefer>
 </alias>
 <!-- Strong: fontconfig weighs each font's generic family before weak
       aliases, and Noto Sans Mono CJK (tagged monospace) won otherwise. -->
 <alias binding="strong">
  <family>monospace</family>
  <prefer>
   <family>JetBrainsMono Nerd Font Mono</family>
   <family>Noto Sans Mono CJK JP</family>
   <family>Noto Color Emoji</family>
   <family>Noto Sans Symbols 2</family>
  </prefer>
 </alias>
 <alias>
  <family>emoji</family>
  <prefer>
   <family>Noto Color Emoji</family>
  </prefer>
 </alias>
 <!-- Match Plasma's conservative grayscale rendering defaults. -->
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
  <edit mode="assign" name="rgba">
   <const>none</const>
  </edit>
 </match>
 <match target="pattern">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="pattern">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="pattern">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
