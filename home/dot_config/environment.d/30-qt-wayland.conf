# Prefer native Wayland for Qt 5/6 while retaining X11 compatibility for
# applications that do not yet support it. Semicolon is Qt's documented
# platform fallback separator.
QT_QPA_PLATFORM=wayland;xcb

# Let xdg-desktop-portal select the backend for the active desktop (GNOME uses
# xdg-desktop-portal-gnome).
QT_USE_PORTAL=1

# Preserve fractional scaling instead of rounding it to an integer.
QT_SCALE_FACTOR_ROUNDING_POLICY=PassThrough
