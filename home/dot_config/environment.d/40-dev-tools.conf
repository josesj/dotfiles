# Rutas XDG de herramientas de desarrollo para toda la sesión de GNOME, no sólo
# para Zsh: sin ellas, JBang o npm lanzados desde VS Code u otra aplicación
# gráfica vuelven a crear ~/.jbang y ~/.npm. .zshrc repite los mismos valores
# para macOS y para las sesiones SSH, que no pasan por environment.d.
JBANG_DIR=${XDG_DATA_HOME:-$HOME/.local/share}/jbang
npm_config_cache=${XDG_CACHE_HOME:-$HOME/.cache}/npm
