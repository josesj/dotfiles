# Use GNOME Keyring's Secret Service implementation for encrypted extension and
# account secrets (gnome-libsecret talks to whichever service owns
# org.freedesktop.secrets).
--password-store=gnome-libsecret

# Native Wayland rendering with modern window and input integration.
--ozone-platform=wayland
--enable-features=WaylandWindowDecorations
--enable-wayland-ime
--wayland-text-input-version=3

# Avoid the current Wayland color-management path on HDR displays.
--disable-features=WaylandWpColorManagerV1
