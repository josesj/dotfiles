# Shared Kitty configuration for the Plasma Wayland desktops.

# Advertise Kitty's native terminal capabilities. The SSH kitten copies the
# matching terminfo entry to remote hosts.
term xterm-kitty

# Typography: preserve the Ghostty metrics and developer glyph coverage.
font_family      family="Iosevka Nerd Font Mono" style="Medium"
bold_font        family="Iosevka Nerd Font Mono" style="Bold"
italic_font      family="Iosevka Nerd Font Mono" style="Medium Italic"
bold_italic_font family="Iosevka Nerd Font Mono" style="Bold Italic"
font_size 12.0
modify_font cell_height 100%

# Kitty follows Plasma automatically: GitHub Light in light mode and GitHub
# Dark Dimmed in dark mode.
background_opacity 1.0

# Start compact and let KWin place the window.
remember_window_size no
remember_window_position no
initial_window_width 100c
initial_window_height 29c
window_padding_width 4
placement_strategy center

# Flexible, predictable panes. The first layout is Kitty's default layout.
enabled_layouts splits:split_axis=horizontal;equalize_on_close=true,stack
window_border_width 1
draw_minimal_borders yes
inactive_text_alpha 0.85

# Show a restrained tab bar only when it is useful.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"

# Readability and input behaviour.
cursor_shape block
cursor_blink_interval 0
cursor_trail 3
mouse_hide_wait -1
scrollback_lines 100000
scrollback_pager_history_size 64

# Preserve the previous clipboard workflow while retaining paste safeguards.
copy_on_select clipboard
paste_actions quote-urls-at-prompt,confirm
strip_trailing_spaces smart

# Zsh integration provides titles, CWD cloning, prompt navigation and output
# browsing. Keep the block cursor and do not wrap sudo.
shell_integration no-cursor no-sudo
confirm_os_window_close -1 count-background

# Notify through Plasma when a long command finishes in the background.
notify_on_cmd_finish unfocused 15

# Preserve the effective Ghostty shortcuts where Kitty has an equivalent.
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 999

map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+o launch --location=vsplit --cwd=current
map ctrl+shift+e launch --location=hsplit --cwd=current
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up neighboring_window up
map ctrl+alt+down neighboring_window down
map ctrl+shift+enter toggle_layout stack
map ctrl+shift+x close_window

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus change_font_size all +1.0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map ctrl+shift+f search_scrollback
map ctrl+shift+page_up scroll_to_prompt -1
map ctrl+shift+page_down scroll_to_prompt 1

map f11 toggle_fullscreen
map ctrl+comma edit_config_file
map ctrl+shift+comma load_config_file
map ctrl+shift+f1 command_palette
