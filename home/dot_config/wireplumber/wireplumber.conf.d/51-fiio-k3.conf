# The FiiO K3 exposes S16_LE and S32_LE over USB. S32_LE is the correct PCM
# container for decoded 24-bit lossless streams and avoids truncation.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-FiiO_K3-00.*"
      }
    ]
    actions = {
      update-props = {
        audio.format                    = "S32LE"
        api.alsa.period-size            = 256
        api.alsa.headroom               = 0
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
