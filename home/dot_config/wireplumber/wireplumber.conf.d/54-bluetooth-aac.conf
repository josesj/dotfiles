# Best available quality for the Nothing Ear. It offers AAC, SBC-XQ and SBC
# for music, and PipeWire already prefers AAC; its encoder defaults to constant
# bitrate, so use the highest-quality variable bitrate mode instead (1..5).
# If LDAC is enabled in the Nothing X app, PipeWire selects it on its own.
monitor.bluez.properties = {
  bluez5.a2dp.aac.bitratemode = 5
}
