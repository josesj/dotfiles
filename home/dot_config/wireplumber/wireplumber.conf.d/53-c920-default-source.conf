# The Logitech C920 microphone is the default capture device on Tycho. A high
# session priority makes WirePlumber pick it over the motherboard input and
# the Bluetooth headsets' hands-free input. With apps recording from the C920,
# the Nothing Ear stays on A2DP during calls instead of switching to HFP.
# The node name carries the webcam's serial number, so match any C920.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.usb-046d_.*C920.*"
      }
    ]
    actions = {
      update-props = {
        node.description = "Logitech C920 (Microphone)"
        node.nick        = "C920"
        priority.session = 3000
        priority.driver  = 3000
      }
    }
  }
]
