# Calidad máxima de remuestreo también en los nodos de dispositivo. Cuando el
# grafo sigue la frecuencia del contenido (44,1 kHz, por ejemplo) y la salida
# no puede cambiar la suya —un auricular Bluetooth la fija al negociar el
# códec—, es el nodo del dispositivo, no el cliente, quien convierte, y los
# ajustes de client.conf.d no llegan hasta él.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        resample.quality = 14
      }
    }
  }
]

monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        resample.quality = 14
      }
    }
  }
]
