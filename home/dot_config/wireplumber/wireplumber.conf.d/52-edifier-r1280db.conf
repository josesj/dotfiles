# The motherboard line output feeds the Edifier R1280DB speakers. Give the
# physical endpoint a useful name in the desktop. Its default session priority
# (1009) already places it below the FiiO K3 and above HDMI. Never suspend it:
# resuming the Realtek codec pops through the speakers and clips the first
# fraction of a second of every sound after silence.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_0d_00.6.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        node.description = "Edifier R1280DB (Line Out)"
        node.nick        = "Edifier R1280DB"
        session.suspend-timeout-seconds = 0
        # Mismo búfer que el FiiO K3: el periodo de serie (1024 muestras, unos
        # 21 ms a 48 kHz) añadía latencia de salida sin evitar ningún xrun.
        api.alsa.period-size            = 256
        api.alsa.headroom               = 0
      }
    }
  }
]
