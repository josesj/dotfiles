# Deimos: keep the RX 6600 HDMI endpoint alive. Repeated suspend/resume cycles
# after monitor hot-plugging otherwise leave duplicate AMD HDA nodes.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_03_00.1.hdmi.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_00_1f.3.*" }
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 10
      }
    }
  }
]
