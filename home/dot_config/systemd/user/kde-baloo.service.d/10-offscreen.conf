[Service]
# baloo_file_extractor abre una QGuiApplication, pero kde-baloo arranca antes
# de que la sesión publique WAYLAND_DISPLAY en el gestor de usuario: sin
# pantalla, Qt aborta (SIGABRT) en cada lote de archivos. Indexar no necesita
# dibujar nada, así que usa la plataforma offscreen.
Environment=QT_QPA_PLATFORM=offscreen
