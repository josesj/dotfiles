# Calidad máxima del remuestreador de PipeWire (14; la de serie es 4). Con
# allowed-rates el grafo sigue la frecuencia del contenido, así que sólo se
# remuestrea cuando suenan a la vez fuentes de frecuencias distintas; ambos
# equipos tienen CPU de sobra para ese caso. pipewire-pulse enlaza este mismo
# archivo para los clientes de PulseAudio.
stream.properties = {
    resample.quality = 14
}
