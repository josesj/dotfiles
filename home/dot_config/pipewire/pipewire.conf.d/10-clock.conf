# Reloj del grafo: 48 kHz por defecto y quantum 256 (unos 5,3 ms) para el
# escritorio; las aplicaciones de baja latencia pueden pedir hasta 32 muestras
# y pw-lowlatency lo fuerza temporalmente.
#
# allowed-rates deja que el grafo cambie a la frecuencia del contenido cuando el
# dispositivo está libre: la música a 44,1 kHz (Spotify, CD) y el material de
# alta resolución llegan sin remuestrear. PipeWire sólo usa las frecuencias que
# admite cada dispositivo; lo demás se remuestrea con la calidad de
# client.conf.d/10-high-quality-resampling.conf.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 2048
}
