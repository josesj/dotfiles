# Common to both Arch workstations. Values Arch or systemd already ship in
# /usr/lib/sysctl.d (inotify limits, vm.max_map_count, fq_codel) or that match
# the kernel default (tcp_fastopen) are deliberately left out.

# Memory and zram. Prefer compressed swap over evicting useful page cache, and
# disable swap readahead, which is counterproductive on an in-memory device.
vm.swappiness = 180
vm.page-cluster = 0
vm.vfs_cache_pressure = 50

# Absolute writeback limits keep latency predictable regardless of RAM size;
# a percentage of a large RAM lets gigabytes of dirty pages pile up.
vm.dirty_bytes = 536870912
vm.dirty_background_bytes = 134217728

# Network.
net.ipv4.tcp_congestion_control = bbr

# Security and local recovery.
kernel.kptr_restrict = 2
kernel.sysrq = 1
