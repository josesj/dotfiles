# Única política SSH de los dos equipos Arch. sshd aplica el primer valor que
# lee de cada opción, así que no debe haber otro archivo en sshd_config.d que
# la contradiga: el antiguo 10-hardening.conf de Deimos se retira desde
# hosts/deimos/obsolete-system.

# Acceso: sólo jose, con clave pública o contraseña; root nunca.
PermitRootLogin no
AllowUsers jose
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no
UsePAM yes
RequiredRSASize 3072

# Límites contra fuerza bruta y agotamiento de recursos. Con la contraseña
# activa conviene pocos intentos por conexión; los clientes usan IdentitiesOnly
# y no agotan los intentos probando claves del agente.
LoginGraceTime 30
MaxAuthTries 3
MaxSessions 10
MaxStartups 10:30:60
PerSourceMaxStartups 10
UnusedConnectionTimeout 2m

# Salud de la sesión.
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive yes

# Reenvíos y funciones opcionales.
AllowAgentForwarding no
AllowTcpForwarding yes
AllowStreamLocalForwarding yes
GatewayPorts no
X11Forwarding no
PermitTunnel no
PermitUserEnvironment no
Compression no

# Higiene de autenticación y diagnóstico.
HostbasedAuthentication no
IgnoreRhosts yes
GSSAPIAuthentication no
KerberosAuthentication no
UseDNS no
LogLevel VERBOSE
VersionAddendum none
