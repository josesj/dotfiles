[Journal]
# Persistent, compressed logs with bounded disk usage.
Storage=persistent
Compress=yes
SystemMaxUse=2G
SystemKeepFree=10G
SystemMaxFileSize=128M
SystemMaxFiles=50
MaxRetentionSec=1year
MaxFileSec=1month

# The journal is the canonical log store on these workstations.
ForwardToSyslog=no
ForwardToKMsg=no
Seal=no
Audit=no
