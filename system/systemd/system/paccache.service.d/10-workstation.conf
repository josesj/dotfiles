# Keep two versions of each installed package (enough to downgrade once) and
# drop every cached version of packages that are no longer installed. The
# stock unit keeps three and never touches uninstalled packages, which left
# 36 GB in /var/cache/pacman/pkg on Deimos.
#
# ExecStart is redefined here rather than editing /etc/conf.d/pacman-contrib,
# which belongs to the package and would produce .pacnew files on upgrades.
[Service]
ExecStart=
ExecStart=/usr/bin/paccache -rk2
ExecStart=/usr/bin/paccache -ruk0
