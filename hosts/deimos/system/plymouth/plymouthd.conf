# Deimos: plymouth.use-simpledrm (en /etc/kernel/cmdline) pinta el splash sobre
# el framebuffer UEFI unos 4 s antes de que amdgpu termine de iniciarse.
# simpledrm no conoce el tamaño físico del monitor (60x34 cm, 162 ppp a 4K) y
# Plymouth supondría escala 2; con amdgpu calcula 1. Fijarla evita el salto.
[Daemon]
Theme=bgrt
DeviceScale=1
