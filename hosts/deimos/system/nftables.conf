#!/usr/sbin/nft -f
# Firewall de entrada de Deimos. Sustituye a firewalld con las mismas reglas que
# tenía: tabla propia (inet workstation) que se reemplaza entera al recargar, sin
# «flush ruleset», para no tocar las reglas que Docker y libvirt crean en las suyas.
#
# Equivalencias con las zonas de firewalld:
#   public  (cualquier interfaz)      ssh, dhcpv6-client
#   private (eno1 y los túneles lodero-*)  ssh, dhcpv6-client, mdns, llmnr, rdp,
#                                          ws-discovery-client
#   docker / libvirt                  todo (target ACCEPT)
# Deimos se usa desde varias redes y el filtro por origen lo hace el cortafuegos
# corporativo de TNG, por eso eno1 entera entra como «private», sin limitar por IP.
table inet workstation
delete table inet workstation

define trusted_ifaces = { "eno1", "lodero-*" }

table inet workstation {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop
    ct state { established, related } accept
    iif lo accept

    # Contenedores y máquinas virtuales hablan con el anfitrión (zonas docker y libvirt).
    iifname { "docker0", "br-*", "virbr*" } accept

    # ICMP: firewalld lo deja pasar en todas sus zonas.
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept

    # Zona public, para cualquier interfaz.
    tcp dport 22 accept comment "ssh"
    ip6 daddr fe80::/64 udp dport 546 accept comment "dhcpv6-client"

    # Zona private: eno1 y los túneles WireGuard.
    iifname $trusted_ifaces tcp dport 3389 accept comment "RDP (KRDP)"
    iifname $trusted_ifaces udp dport 5353 accept comment "mDNS"
    iifname $trusted_ifaces meta l4proto { tcp, udp } th dport 5355 accept comment "LLMNR"
    iifname $trusted_ifaces udp sport 3702 accept comment "ws-discovery-client"

    # Como firewalld: lo demás se rechaza con un ICMP «prohibido».
    reject with icmpx type admin-prohibited
  }
}
