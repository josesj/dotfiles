# Intel Core i5-12600, Radeon RX 6600, NVMe root on Btrfs, systemd initramfs
# and UKIs.
#
# amdgpu stays out of the initramfs (no kms hook, not in MODULES). Loading and
# probing it costs about 4 s of CPU, and the initrd cannot switch root until
# udev finishes that work. From the real root it loads in parallel with the
# rest of the boot while Plymouth draws on simpledrm (plymouth.use-simpledrm).
MODULES=(btrfs)

BINARIES=()
# EDID del LG 27UP850: drm.edid_firmware lo necesita en el initramfs porque
# amdgpu se carga allí (ver hosts/deimos/README.md).
FILES=(/usr/lib/firmware/edid/lg-27up850.bin)

# No encryption/LVM/RAID is used. systemd supplies resume support when a
# resume device is configured; sd-vconsole keeps the early console usable.
HOOKS=(base systemd plymouth autodetect microcode modconf sd-vconsole block filesystems)

COMPRESSION="zstd"
