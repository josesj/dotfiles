# Ajustes de makepkg de Deimos (el makepkg.conf del paquete queda como viene).
# ccache, BUILDDIR en tmpfs, tantos trabajos como núcleos y Rust optimizado para esta CPU.
BUILDENV=(!distcc color ccache check !sign)
BUILDDIR=/tmp/makepkg
MAKEFLAGS="-j$(nproc)"
NINJAFLAGS="-j$(nproc)"
RUSTFLAGS="-C opt-level=2 -C target-cpu=native"
