# ASUS PRIME B660M-A D4 — Nuvoton NCT6798D
#
# Presentation-only configuration. Fan control remains owned by the UEFI;
# this file does not write PWM values, thresholds or chip registers.

chip "nct6798-*"

    # Reliable board/CPU temperature sources.
    label temp1 "Motherboard"
    label temp2 "CPU socket"
    label temp8 "CPU PECI"

    # Unconnected or nonsensical temperature channels on this board.
    ignore temp4
    ignore temp5
    ignore temp7
    ignore temp9
    ignore temp10
    ignore temp11
    ignore temp12

    # Voltage dividers and rail mappings are not published by ASUS. Raw
    # readings therefore cannot be labelled or alarmed reliably.
    ignore in0
    ignore in1
    ignore in2
    ignore in3
    ignore in4
    ignore in5
    ignore in6
    ignore in7
    ignore in8
    ignore in9
    ignore in10
    ignore in11
    ignore in12
    ignore in13
    ignore in14

    # Unimplemented PWM channels report impossible percentages.
    ignore pwm6
    ignore pwm7

    # The board exposes four physical fan headers; extra tachometer channels
    # belong to unimplemented Super I/O inputs.
    ignore fan6
    ignore fan7

    # Secondary chassis-intrusion input is not connected.
    ignore intrusion1
