# ASUS USB-BT500 (0b05:190e, Realtek RTL8761BU)
#
# The adapter reports corrupted SCO packets when an HFP/HSP profile opens.
# Force the kernel's SCO buffer-size quirk and keep the USB transport awake so
# videoconference microphone streams can switch reliably from A2DP to HFP.
options btusb force_scofix=1 enable_autosuspend=0
