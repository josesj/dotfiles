# ASUS USB-BT500 (0b05:190e, Realtek RTL8761BU)
#
# Keep the USB transport awake: btusb enables autosuspend again when it binds,
# so a udev rule alone is not enough. HFP calls still report corrupted SCO
# packets while the adapter sits behind the ASM1074 hub (see README);
# force_scofix only fixes CSR-clone buffer sizes and did not help.
options btusb enable_autosuspend=0
