# Ajustes locales de journald. Reversible: basta borrar este fichero.
# El historial largo es deliberado: sirve para diagnosticar cuelgues esporádicos.
[Journal]
# Explícito, para no caer nunca a almacenamiento volátil y perder el historial
Storage=persistent
# Tope explícito (por defecto serían 4G). Al ritmo actual (~1 GB/año) ≈ 2 años
SystemMaxUse=2G
SystemKeepFree=2G
# Ficheros más pequeños: un reinicio forzado corrompe menos historial
SystemMaxFileSize=128M
