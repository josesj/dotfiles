#!/usr/sbin/nft -f
# Firewall de entrada de tycho. Es una tabla propia (inet workstation) que se
# sustituye entera al recargar: no hay «flush ruleset», así que no toca las
# reglas que Docker y libvirt crean en sus propias tablas.
#
# Política: se descarta todo lo que entra salvo loopback, conexiones ya
# iniciadas desde aquí, ICMP, el tráfico de los puentes de Docker y de libvirt,
# y lo que se abre a continuación sólo a la red local.
table inet workstation
delete table inet workstation

# Red local y túnel WireGuard del router (wg0: iPhone, iPad y phobos). El router
# no hace NAT entre wg0 y la LAN, así que tycho ve las direcciones 192.168.9.x
# y fd00:9::/64 de los clientes.
define lan4 = { 192.168.0.0/24, 192.168.9.0/24 }
define lan6 = { fdb0:43e8:a84b::/64, fe80::/10, fd00:9::/64 }

table inet workstation {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop
    ct state { established, related } accept
    iif lo accept

    # Contenedores y máquinas virtuales hablan con el equipo anfitrión.
    iifname { "docker0", "br-*", "virbr*" } accept

    # ICMP (ping, descubrimiento de vecinos y routers en IPv6 son imprescindibles).
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept

    # DHCP del router.
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept

    # Sólo desde la red local y el túnel WireGuard.
    ip saddr $lan4 tcp dport 22 accept comment "ssh"
    ip6 saddr $lan6 tcp dport 22 accept comment "ssh por IPv6"
    ip saddr $lan4 meta l4proto { tcp, udp } th dport 1714-1764 accept comment "KDE Connect"
    ip6 saddr $lan6 meta l4proto { tcp, udp } th dport 1714-1764 accept comment "KDE Connect por IPv6"
    ip saddr $lan4 udp dport 5353 accept comment "mDNS"
    ip6 saddr $lan6 udp dport 5353 accept comment "mDNS por IPv6"
    ip saddr $lan4 udp dport 27031-27036 accept comment "Steam Remote Play"
    ip saddr $lan4 tcp dport { 27036, 27037 } accept comment "Steam Remote Play"
  }
}
