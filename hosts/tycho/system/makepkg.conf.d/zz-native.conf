# Compila los paquetes de AUR para el Ryzen 7 9700X (Zen 5) en lugar de x86-64
# genérico. Sólo afecta a lo que se construye en Tycho: los binarios pueden no
# arrancar en otra CPU. El prefijo zz- hace que se lea después de fortran.conf
# y rust.conf, que pacman instala en este mismo directorio.
CFLAGS=${CFLAGS/-march=x86-64 -mtune=generic/-march=native}
CXXFLAGS=${CXXFLAGS/-march=x86-64 -mtune=generic/-march=native}
FFLAGS=${FFLAGS/-march=x86-64 -mtune=generic/-march=native}
FCFLAGS=${FCFLAGS/-march=x86-64 -mtune=generic/-march=native}
RUSTFLAGS+=" -C target-cpu=native"
