# Temporary performance profile for games. Settings are restored when the
# final GameMode client exits.
[general]
desiredgov=performance
defaultgov=powersave
softrealtime=off
renice=10
ioprio=0
inhibit_screensaver=1
disable_splitlock=1

# The Ryzen 7 9700X has one homogeneous CCD, so topology pinning/parking is
# unnecessary. NVIDIA clock offsets and forced PowerMizer are intentionally
# left untouched; the driver can manage boost within its normal power limits.
[cpu]
park_cores=no
pin_cores=no
