# AMD Ryzen, NVIDIA early KMS, NVMe root on Btrfs, systemd initramfs and UKIs.
MODULES=(btrfs nvidia nvidia_modeset nvidia_uvm nvidia_drm)

BINARIES=()
FILES=()

# No encryption/LVM/RAID is used. systemd supplies resume support when a
# resume device is configured; sd-vconsole keeps the early console usable.
HOOKS=(base systemd plymouth autodetect microcode modconf kms sd-vconsole block filesystems)

COMPRESSION="zstd"
