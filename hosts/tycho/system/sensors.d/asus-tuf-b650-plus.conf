# ASUS TUF GAMING B650-PLUS (Nuvoton NCT6799D-R)
# Conservative monitoring profile. Fan control remains managed by UEFI Q-Fan.

chip "nct6799-*"

    label in0 "VCORE"

    label in1 "+5V"
    compute in1 @ * 5, @ / 5
    set in1_min 4.75
    set in1_max 5.25

    label in2 "AVSB"
    set in2_min 3.14
    set in2_max 3.47

    label in3 "+3.3V"
    set in3_min 3.14
    set in3_max 3.47

    label in4 "+12V"
    compute in4 @ * 12, @ / 12
    set in4_min 11.40
    set in4_max 12.60

    label in5 "CHIPSET"
    set in5_min 0.80
    set in5_max 1.40

    label in6 "APU_VDDIO"
    set in6_max 1.20

    label in7 "+3.3VSB"
    set in7_min 3.14
    set in7_max 3.47

    label in8 "VBAT"
    set in8_min 2.50
    set in8_max 3.50

    ignore in9
    ignore in10
    ignore in11
    ignore in12
    ignore in13
    ignore in14
    ignore in15
    ignore in16
    ignore in17

    label fan1 "CHA_FAN1"
    label fan2 "CPU_FAN"
    label fan3 "CHA_FAN2"
    label fan4 "CHA_FAN3"
    label fan5 "CPU_OPT"
    label fan6 "CHA_FAN4"
    label fan7 "AIO_PUMP"

    label temp1 "SYSTEM"
    label temp2 "CPU_SOCKET"
    ignore temp3
    ignore temp4
    ignore temp5
    ignore temp6
    ignore temp7
    ignore temp8
    ignore temp9
    ignore temp10
    ignore temp11
    ignore temp12
    ignore temp13

    ignore pwm1
    ignore pwm2
    ignore pwm3
    ignore pwm4
    ignore pwm5
    ignore pwm6
    ignore pwm7

    ignore intrusion0
    ignore intrusion1
    ignore beep_enable

chip "k10temp-pci-00c3"
    label temp1 "CPU (Tctl)"
    label temp3 "CPU CCD"

chip "spd5118-i2c-*-50"
    label temp1 "DIMM A1"

chip "spd5118-i2c-*-51"
    label temp1 "DIMM A2"

chip "spd5118-i2c-*-52"
    label temp1 "DIMM B1"

chip "spd5118-i2c-*-53"
    label temp1 "DIMM B2"

chip "nvme-pci-0200"
    label temp1 "System NVMe"

chip "nvme-pci-0c00"
    label temp1 "Docker/Storage NVMe"

chip "r8169_0_800:00-*"
    label temp1 "2.5GbE Controller"
