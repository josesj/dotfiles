version: 7
daemon:
  log_level: info
  admin_group: wheel
  disable_clocks_cleanup: false
apply_settings_timer: 5

# Keep the desktop on the NVIDIA defaults. GameMode activates the dedicated
# profile only while a game is running, then LACT restores this default state.
profiles:
  Gaming:
    gpus:
      10DE:2C02-1462:5310-0000:01:00.0:
        # Stock fan curve (MSI zero-RPM at idle).
        fan_control_enabled: false
        power_mizer_mode: PreferMaximumPerformance
        # The undervolt already bounds power draw; keep the full 360 W board
        # limit for transient loads instead of clipping heavy 4K/RT scenes.
        power_cap: 360.0
        # Conservative GDDR7 offset; untested above +1000.
        mem_clock_offsets:
          0: 1000
        # Performance undervolt: +442 MHz up to 925 mV (2917 MHz), flattened
        # above that voltage so the GPU never boosts past 2917 MHz.
        nvidia_gpu_vf_curve:
